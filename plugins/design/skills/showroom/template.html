<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showroom · __PART_NAME__</title>

<!--
  SHOWROOM TEMPLATE
  Fill in only the marked slots; leave the showroom chrome alone.
    1. FONTS   - @font-face rules / font <link>s the project uses. Every <link> and the
                 #project-fonts style in <head> are copied into each preview frame.
    2. ASSETS  - copy images, icons and fonts next to this file and reference them
                 with relative paths (e.g. "assets/hero.jpg").
    3. DATA    - window.SHOWROOM near the bottom: sections, options, CSS and copy text.
  Each preview renders in its own iframe, so the project's CSS can be pasted as-is
  (:root tokens, body styles, @media breakpoints all behave as on the real site).
  Option markup can be a string (`html`) or a <template id="..."> (`template`),
  which is easier for long markup. Templates go in slot 3b.
-->

<!-- ============ SLOT 1: PROJECT FONTS ============ -->
<style id="project-fonts">

</style>
<!-- ============ /SLOT 1 ============ -->

<style>
  /* ---------- Showroom chrome. Do not restyle per project. ---------- */
  :root {
    --sr-bg: #f4f3f1;
    --sr-panel: #ffffff;
    --sr-ink: #17171a;
    --sr-ink-2: #5d5d66;
    --sr-ink-3: #8d8d96;
    --sr-line: rgba(23, 23, 26, 0.09);
    --sr-line-2: rgba(23, 23, 26, 0.16);
    --sr-accent: #3b5bfd;
    --sr-accent-soft: rgba(59, 91, 253, 0.1);
    --sr-good: #16a36b;
    --sr-warn: #c27803;
    --sr-bad: #d1403a;
    --sr-bold: #9b3df5;
    --sr-radius: 14px;
    --sr-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    --sr-shadow-lift: 0 2px 4px rgba(0,0,0,.05), 0 10px 28px rgba(0,0,0,.09);
    --sr-ease: cubic-bezier(.2, .8, .2, 1);
    --sr-press: cubic-bezier(.3, 0, .5, 1);
    --sr-font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --sr-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.45 var(--sr-font);
    color: var(--sr-ink);
    background: var(--sr-bg);
    -webkit-font-smoothing: antialiased;
  }

  /* Shared press feel for every showroom control */
  .sr-press {
    transition: transform .16s var(--sr-ease), box-shadow .2s var(--sr-ease),
                background-color .16s var(--sr-ease), border-color .16s var(--sr-ease),
                color .16s var(--sr-ease), opacity .16s var(--sr-ease);
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .sr-press:active { transform: scale(.97); transition-duration: .07s; transition-timing-function: var(--sr-press); }
  .sr-press:focus-visible { outline: 2px solid var(--sr-accent); outline-offset: 2px; }

  /* Top bar */
  .sr-top {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 20px;
    background: rgba(244, 243, 241, .82);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--sr-line);
  }
  .sr-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    background: var(--sr-ink); color: #fff;
    font-size: 12px; font-weight: 600; letter-spacing: .01em; white-space: nowrap;
  }
  .sr-pill i { width: 7px; height: 7px; border-radius: 50%; background: #ffcf4a; box-shadow: 0 0 0 3px rgba(255,207,74,.25); }
  .sr-title { font-weight: 650; font-size: 15px; white-space: nowrap; }
  .sr-sel { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .sr-chip {
    display: inline-flex; gap: 6px; align-items: center;
    padding: 4px 10px; border-radius: 999px;
    background: var(--sr-panel); border: 1px solid var(--sr-line);
    font-size: 12px; color: var(--sr-ink-2); white-space: nowrap;
  }
  .sr-chip b { color: var(--sr-ink); font-family: var(--sr-mono); font-size: 11.5px; }
  .sr-chip.is-changed { border-color: var(--sr-accent); background: var(--sr-accent-soft); }
  .sr-jump { border: 0; background: var(--sr-accent); color: #fff; font: inherit; font-weight: 600; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; }
  .sr-jump:hover { box-shadow: 0 4px 14px rgba(59,91,253,.35); transform: translateY(-1px); }

  main { max-width: 1680px; margin: 0 auto; padding: 22px 20px 40px; }
  .sr-intro { color: var(--sr-ink-2); margin: 0 0 18px; max-width: 900px; }
  .sr-intro:empty { display: none; }

  /* Section */
  .sr-section { margin: 0 0 34px; }
  .sr-section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
  .sr-section-head h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  .sr-section-head p { margin: 0; color: var(--sr-ink-2); }
  .sr-grid { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 980px) { .sr-grid { grid-template-columns: minmax(0, 1fr); } }

  /* Segmented control (variants, viewport) */
  .sr-seg { display: inline-flex; padding: 3px; gap: 2px; background: rgba(23,23,26,.06); border-radius: 10px; }
  .sr-seg button {
    border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 550;
    color: var(--sr-ink-2); padding: 6px 12px; border-radius: 8px;
  }
  .sr-seg button:hover { color: var(--sr-ink); background: rgba(255,255,255,.5); }
  .sr-seg button[aria-pressed="true"] { background: var(--sr-panel); color: var(--sr-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05); }

  /* Option list */
  .sr-list { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; padding: 2px 4px 8px 2px; }
  @media (max-width: 980px) { .sr-list { position: static; max-height: none; } }
  .sr-card {
    position: relative; text-align: left; width: 100%;
    font: inherit; color: inherit;
    padding: 12px 14px;
    background: var(--sr-panel);
    border: 1px solid var(--sr-line);
    border-radius: var(--sr-radius);
    box-shadow: 0 1px 1px rgba(0,0,0,.02);
  }
  .sr-card:hover { border-color: var(--sr-line-2); box-shadow: var(--sr-shadow-lift); transform: translateY(-1px); }
  .sr-card:active { transform: translateY(0) scale(.985); }
  .sr-card[aria-checked="true"] {
    border-color: var(--sr-accent);
    box-shadow: 0 0 0 3px var(--sr-accent-soft), var(--sr-shadow);
  }
  .sr-card-top { display: flex; align-items: center; gap: 8px; }
  .sr-id {
    font-family: var(--sr-mono); font-size: 11.5px; font-weight: 700;
    padding: 2px 6px; border-radius: 6px; background: rgba(23,23,26,.06); color: var(--sr-ink-2);
    transition: background-color .16s var(--sr-ease), color .16s var(--sr-ease);
  }
  .sr-card[aria-checked="true"] .sr-id { background: var(--sr-accent); color: #fff; }
  .sr-card h3 { margin: 0; font-size: 14px; font-weight: 620; flex: 1; }
  .sr-radio {
    width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--sr-line-2); flex: none;
    display: grid; place-items: center; transition: border-color .16s var(--sr-ease);
  }
  .sr-radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sr-accent); transform: scale(0); transition: transform .22s var(--sr-ease); }
  .sr-card[aria-checked="true"] .sr-radio { border-color: var(--sr-accent); }
  .sr-card[aria-checked="true"] .sr-radio::after { transform: scale(1); }
  .sr-why { margin: 5px 0 0; color: var(--sr-ink-2); font-size: 13px; }
  .sr-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .sr-badges:empty { display: none; }
  .sr-badge { font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 6px; letter-spacing: .01em; }
  .sr-badge.recommended { background: rgba(22,163,107,.12); color: var(--sr-good); }
  .sr-badge.bold { background: rgba(155,61,245,.12); color: var(--sr-bold); }
  .sr-badge.overclaims { background: rgba(209,64,58,.12); color: var(--sr-bad); }
  .sr-badge.heavy { background: rgba(194,120,3,.13); color: var(--sr-warn); }
  .sr-badge.simulated, .sr-badge.current { background: rgba(23,23,26,.07); color: var(--sr-ink-2); }
  .sr-note { margin: 6px 0 0; font-size: 12px; color: var(--sr-ink-3); }
  .sr-note b { font-weight: 650; }
  .sr-note.bad b { color: var(--sr-bad); }
  .sr-note.warn b { color: var(--sr-warn); }
  .sr-note.good b { color: var(--sr-good); }

  /* Toggles */
  .sr-toggles { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--sr-line-2); }
  .sr-toggle { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; font: inherit; color: var(--sr-ink); padding: 6px 4px; border-radius: 8px; text-align: left; }
  .sr-toggle:hover { background: rgba(23,23,26,.04); }
  .sr-switch { width: 32px; height: 19px; border-radius: 999px; background: rgba(23,23,26,.18); position: relative; flex: none; transition: background-color .2s var(--sr-ease); }
  .sr-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .24s var(--sr-ease); }
  .sr-toggle[aria-checked="true"] .sr-switch { background: var(--sr-accent); }
  .sr-toggle[aria-checked="true"] .sr-switch::after { transform: translateX(13px); }
  .sr-toggle small { display: block; color: var(--sr-ink-3); font-size: 12px; }

  /* Preview pane */
  .sr-pane { background: var(--sr-panel); border: 1px solid var(--sr-line); border-radius: calc(var(--sr-radius) + 4px); box-shadow: var(--sr-shadow); overflow: hidden; }
  .sr-pane-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--sr-line); }
  .sr-pane-bar .sr-now { font-weight: 620; }
  .sr-pane-bar .sr-now b { font-family: var(--sr-mono); color: var(--sr-accent); margin-right: 6px; }
  .sr-spacer { flex: 1; }
  .sr-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--sr-line-2); background: var(--sr-panel); color: var(--sr-ink);
    font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 9px;
  }
  .sr-btn:hover { background: #fafafa; border-color: rgba(23,23,26,.24); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .sr-btn svg { width: 14px; height: 14px; }
  .sr-btn.spin svg { animation: sr-spin .55s var(--sr-ease); }
  @keyframes sr-spin { to { transform: rotate(-360deg); } }
  .sr-stage-wrap { background: repeating-conic-gradient(rgba(23,23,26,.035) 0 25%, transparent 0 50%) 0 0 / 18px 18px; display: flex; justify-content: center; }
  .sr-stage { width: 100%; transition: max-width .35s var(--sr-ease); background: #fff; overflow: hidden; }
  .sr-frame { display: block; width: 100%; border: 0; background: transparent; }
  .sr-frame.is-scroll { overscroll-behavior: contain; }

  /* Playback bar */
  .sr-play { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--sr-line); background: #fbfbfa; }
  .sr-iconbtn {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0;
    display: grid; place-items: center; background: var(--sr-ink); color: #fff;
  }
  .sr-iconbtn:hover { transform: scale(1.06); box-shadow: 0 3px 10px rgba(0,0,0,.2); }
  .sr-iconbtn:active { transform: scale(.92); }
  .sr-iconbtn svg { width: 12px; height: 12px; }
  .sr-scrub { flex: 1; min-width: 120px; height: 20px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; --p: 0%; }
  .sr-scrub:focus-visible { outline: 2px solid var(--sr-accent); outline-offset: 2px; border-radius: 6px; }
  .sr-scrub::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(var(--sr-accent), var(--sr-accent)) 0 0 / var(--p) 100% no-repeat, rgba(23,23,26,.12); }
  .sr-scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; border: 1.5px solid var(--sr-accent); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s var(--sr-ease); }
  .sr-scrub:hover::-webkit-slider-thumb { transform: scale(1.18); }
  .sr-scrub:active::-webkit-slider-thumb { transform: scale(.92); }
  .sr-scrub::-moz-range-track { height: 4px; border-radius: 99px; background: rgba(23,23,26,.12); }
  .sr-scrub::-moz-range-progress { height: 4px; border-radius: 99px; background: var(--sr-accent); }
  .sr-scrub::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 1.5px solid var(--sr-accent); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .sr-time { font: 11.5px var(--sr-mono); color: var(--sr-ink-2); min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
  .sr-seg.sm button { padding: 4px 8px; font-size: 11.5px; }
  .sr-loop { padding: 4px 6px; font-size: 12px; font-weight: 600; color: var(--sr-ink-2); }
  .sr-loop .sr-switch { width: 26px; height: 16px; }
  .sr-loop .sr-switch::after { width: 12px; height: 12px; }
  .sr-loop[aria-checked="true"] .sr-switch::after { transform: translateX(10px); }
  .sr-play.is-idle .sr-scrub, .sr-play.is-idle .sr-time, .sr-play.is-idle .sr-iconbtn, .sr-play.is-idle .sr-loop { opacity: .38; pointer-events: none; }

  .sr-flags { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; border-top: 1px solid var(--sr-line); background: #fbfbfa; }
  .sr-flags:empty { display: none; }
  .sr-flag { font-size: 12px; color: var(--sr-ink-2); }
  .sr-flag::before { content: "◌ "; color: var(--sr-ink-3); }

  /* Copy panel */
  .sr-copy { margin: 10px 0 0; background: var(--sr-ink); color: #fff; border-radius: 22px; padding: 26px; display: grid; grid-template-columns: 1fr auto; gap: 18px 24px; align-items: center; }
  @media (max-width: 800px) { .sr-copy { grid-template-columns: 1fr; } }
  .sr-copy h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  .sr-copy p { margin: 0; color: rgba(255,255,255,.65); }
  .sr-copy pre {
    grid-column: 1 / -1; margin: 0; padding: 14px 16px; border-radius: 12px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    font: 12.5px/1.55 var(--sr-mono); color: rgba(255,255,255,.88);
    white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto;
  }
  .sr-copy textarea {
    grid-column: 1 / -1; width: 100%; min-height: 200px; padding: 14px; border-radius: 12px;
    font: 12.5px/1.55 var(--sr-mono); border: 2px solid #ffcf4a; background: #fff; color: var(--sr-ink);
  }
  .sr-copybtn {
    position: relative; overflow: hidden;
    border: 0; border-radius: 16px; padding: 18px 30px; min-width: 240px;
    background: #fff; color: var(--sr-ink);
    font: inherit; font-size: 17px; font-weight: 700; letter-spacing: -.01em;
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 8px 24px rgba(0,0,0,.35);
  }
  .sr-copybtn:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 14px 34px rgba(0,0,0,.45); }
  .sr-copybtn:active { transform: translateY(0) scale(.96); }
  .sr-copybtn .lbl { display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .32s var(--sr-ease), opacity .2s var(--sr-ease); }
  .sr-copybtn .done { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; background: var(--sr-good); transform: translateY(100%); transition: transform .34s var(--sr-ease); }
  .sr-copybtn.copied .lbl { transform: translateY(-120%); opacity: 0; }
  .sr-copybtn.copied .done { transform: translateY(0); }
  .sr-copybtn .done svg { width: 20px; height: 20px; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .12s var(--sr-ease); }
  .sr-copybtn.copied .done svg { stroke-dashoffset: 0; }
  .sr-fallback-note { grid-column: 1 / -1; color: #ffcf4a !important; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .sr-press, .sr-card, .sr-switch::after, .sr-radio::after, .sr-copybtn .lbl, .sr-copybtn .done, .sr-copybtn .done svg, .sr-stage { transition-duration: .01ms !important; }
    .sr-btn.spin svg { animation: none; }
    .sr-press:active, .sr-card:active, .sr-copybtn:active, .sr-card:hover, .sr-copybtn:hover { transform: none; }
  }
</style>
</head>
<body>

<header class="sr-top">
  <span class="sr-pill"><i></i>Preview only · nothing implemented</span>
  <span class="sr-title" id="sr-title"></span>
  <div class="sr-sel" id="sr-sel" aria-live="polite"></div>
  <button class="sr-jump sr-press" id="sr-jump" type="button">Copy my choice ↓</button>
</header>

<main>
  <p class="sr-intro" id="sr-intro"></p>
  <div id="sr-sections"></div>

  <section class="sr-copy" id="sr-copy">
    <div>
      <h2>Happy with your picks?</h2>
      <p>Copy this and paste it into Claude Code. It names exact option IDs and copy, so it stands on its own.</p>
    </div>
    <button class="sr-copybtn sr-press" id="sr-copybtn" type="button">
      <span class="lbl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        Copy my choice
      </span>
      <span class="done" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Copied
      </span>
    </button>
    <pre id="sr-out"></pre>
  </section>
</main>

<!-- ============ SLOT 3: SHOWROOM DATA ============ -->
<script>
window.SHOWROOM = {
  part: "__PART_NAME__",               // what the user asked about, e.g. "Home hero"
  date: "__YYYY-MM-DD__",
  intro: "",                            // optional line: what's explored, anything simulated overall
  filesToChange: [                      // real repo paths found while reading the code
    // "src/components/Hero.tsx", "src/app/globals.css"
  ],
  // CSS shared by every preview: the project's real tokens and base styles, copied from the repo.
  // Paste it as it is in the repo: :root, body and @media rules work unchanged.
  projectCss: `
    /* :root { --brand: #...; } body { font-family: "Brand", sans-serif; } */
  `,
  // Script URLs loaded into every preview frame before the markup, e.g. GSAP or lottie-web from a CDN.
  // Sections and options can add their own `libs` too. In option scripts use ctx.window.gsap etc.
  libs: [],
  // Optional toggles. When on, the preview's <html> gets class "t-<id>" (style with html.t-<id> ...)
  // and the copied text records it.
  toggles: [
    // { id: "subtitle", label: "Also change the subtitle", hint: "Uses each option's subtitle", default: false }
  ],
  sections: [
    {
      id: "main",                       // stable key
      label: "__SECTION_LABEL__",       // shown in headings and in the copied text
      blurb: "",                        // optional line under the heading
      idPrefix: "A",                    // option IDs become A0, A1, A2...
      // Optional variants: modes the real UI has. Each variant gets its own pick.
      variants: [
        // { id: "biz", label: "For businesses" }, { id: "consumer", label: "For consumers" }
      ],
      css: ``,                          // CSS shared by this section's options (copied from the real component)
      // scroll: a number makes the stage a fixed-height window you scroll inside, for scroll-linked
      // effects (animation-timeline: view()/scroll(), IntersectionObserver, sticky, parallax).
      stage: { background: "#fff", minHeight: 360, padding: "0" /*, scroll: 560 */ },
      simulated: [],                    // section-wide notes, e.g. "Nav bar omitted"
      options: [
        {
          n: 0,                         // 0 is always the current version
          title: "Current",
          why: "What ships today, for comparison.",
          // variant: "biz",            // set when the option belongs to one variant only
          html: `<!-- real current markup -->`,   // or template: "tpl-A0"
          css: ``,                      // option-only CSS; scoped automatically
          // script(root, ctx) { ... },  // optional JS motion; re-runs on Replay.
          //   ctx = { variant, toggles, reducedMotion, document, window } of the preview frame.
          //   The playback bar drives CSS animations/transitions and el.animate() on its own.
          //   For other motion return one of:
          //     - a cleanup function
          //     - a GSAP timeline or tween (pause, speed and scrub then work on it)
          //     - { duration: ms, seek(ms), play(), pause(), setRate(r), cleanup() }, any subset
          // libs: [],                  // extra script URLs for this option only
          pick: "",                     // exact copy, or one line describing the design/motion; goes into the copied text
          badges: [],                   // any of: "recommended", "bold", "simulated"
          recommendedWhy: "",           // one sentence, with "recommended"
